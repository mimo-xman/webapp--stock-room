# Netlify — Stockroom web app
# Site settings: base directory = web, or deploy this folder directly.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set in the Netlify UI (Site configuration → Environment variables):
#   NEXT_PUBLIC_API_URL = https://<your-render-service>.onrender.com
