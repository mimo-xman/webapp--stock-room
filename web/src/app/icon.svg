<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Stock Room — SR monogram plate: paper ground, brand-orange plate with
       hard ink shadow, tilted -4deg (same identity as the TopBar plate). -->
  <rect width="64" height="64" rx="14" fill="#f3f2ed"/>
  <g transform="rotate(-4 32 32)">
    <rect x="15" y="15" width="36" height="36" fill="#17181c"/>
    <rect x="11" y="11" width="36" height="36" fill="#e8500a"/>
    <text x="29" y="35" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-size="18.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">SR</text>
  </g>
</svg>
