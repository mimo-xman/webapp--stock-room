# Upscale batch — ETSY EDITION, daily at 10:00 Morocco + manual runs.
#
# Same parallel-worker machine as upscale-batch.yml, but for the images
# nested inside Etsy products (etsy_products.images[] — each image has its
# OWN upscales array). The two businesses were split apart, so each keeps
# its own workflow:
#
#   upscale-batch.yml      → sellable images (images_to_bay)     — 08:00 Maroc
#   upscale-etsy-batch.yml → THIS ONE, Etsy product images       — 10:00 Maroc
#
# The 2-hour offset is deliberate: the two batches never run at the same
# moment, so the Render API (free tier) never wakes under a 20-worker stampede.
#
# The schedule fires at 09:00 UTC = 10:00 Morocco (UTC+1). During Ramadan
# Morocco runs UTC+0, so the job fires at 09:00 local then.
#
# Worker loop (identical protocol, dedicated nested routes):
#
#     claim one eligible product image (atomic POST /api/etsy-products/claim —
#     upscales count < max, active, not already claimed by another worker)
#       → Real-ESRGAN → Cloudinary (folder etsy-products/upscales by default)
#       → POST /api/etsy-products/:id/images/:imageId/upscales
#       → release 'ok'
#     claim the next… until the API answers "nothing left to claim".
#
# Required repo secrets (shared with the other upscale workflows —
# see docs/UPSCALE.md):
#   ASSET_API_URL                          — API Render base URL
#   ASSET_API_KEY                          — agent key (same as API_KEY on Render)
#   CLOUDINARY_CLOUD_NAME / _API_KEY / _API_SECRET
# Optional repo secrets (job defaults, overridable per run):
#   MAX_NUMBER_OF_UPSCALES_PER_IMAGE (default 1) · DEFAULT_SCALE (default 4)
#   UPSCALE_TILE_WORKERS (default auto)
name: Upscale — batch Etsy

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      worker_count:
        description: "Nombre de jobs parallèles (chacun réclame des images différentes — 1 à 20)"
        required: false
        default: "10"
      max_upscales_per_image:
        description: "Max upscales par image de produit (vide = secret MAX_NUMBER_OF_UPSCALES_PER_IMAGE, sinon 1)"
        required: false
        default: ""
      scale:
        description: "Facteur d'upscale 2-8 (vide = secret DEFAULT_SCALE, sinon 4)"
        required: false
        default: ""
      model:
        description: "Modèle Real-ESRGAN"
        type: choice
        options:
          - RealESRGAN_x4plus
          - realesr-general-x4v3
          - RealESRGAN_x2plus
        default: RealESRGAN_x4plus
      output_format:
        description: "Format de sortie — jpg : ~2-4 Mo (limite Cloudinary 10 Mo) ; png : lossless, lourd"
        type: choice
        options:
          - jpg
          - png
        default: jpg
      jpeg_quality:
        description: "Qualité JPEG 80-100 (réduite automatiquement si le fichier dépasse la limite Cloudinary)"
        required: false
        default: "95"
      tile_workers:
        description: "Processus par tuile Real-ESRGAN (vide = auto : un par cœur CPU, max 4 — résultat identique au séquentiel)"
        required: false
        default: ""
      max_images:
        description: "Images traitées max PAR WORKER (total ≈ max_images × worker_count)"
        required: false
        default: "5"
      dry_run:
        description: "Lister les images de produits éligibles sans rien upscaler"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upscale-etsy-batch
  cancel-in-progress: false

jobs:
  # ── 1. wake the API up + compute the worker matrix ─────────────────────────
  warmup:
    name: Wake API + plan workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      ASSET_API_URL: ${{ secrets.ASSET_API_URL }}
    steps:
      - name: Plan the worker matrix
        id: plan
        run: |
          N="${{ inputs.worker_count || '10' }}"
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ]; then N=10; fi
          if [ "$N" -gt 20 ]; then N=20; fi
          ids=()
          for i in $(seq 1 "$N"); do ids+=("w$i"); done
          json=$(printf '"%s",' "${ids[@]}")
          echo "matrix=[${json%,}]" >> "$GITHUB_OUTPUT"
          echo "Planned $N parallel worker job(s)."

      - name: Ping the API until it answers (Render free tier wakes in ~30-90 s)
        run: |
          URL="${ASSET_API_URL%/}"
          if [ -z "$URL" ]; then
            echo "::error::ASSET_API_URL secret is empty — configure it in the repo settings."
            exit 1
          fi
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/health" || echo 000)
            echo "attempt $i/60 → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "API is awake."
              exit 0
            fi
            sleep 5
          done
          echo "::error::API unreachable after 60 attempts (~5 min) — open $URL in a browser to restart the Render service, then rerun this workflow."
          exit 1

  # ── 2. N identical workers, each claiming different product images ───────
  upscale:
    name: Worker ${{ matrix.worker }}
    needs: warmup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One worker failing (or being cancelled) must not kill the others.
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.warmup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: upscale-pip-${{ hashFiles('scripts/upscale/requirements.txt') }}
          restore-keys: upscale-pip-

      - name: Cache Real-ESRGAN models
        uses: actions/cache@v6
        with:
          path: ~/.cache/upscale-models
          key: upscale-models-v1

      - name: Install dependencies (CPU-only torch)
        # Two-phase on purpose: basicsr 1.4.2 ships an sdist whose isolated
        # build would re-download torch (~200 MB) — installing torch first
        # then building basicsr with --no-build-isolation avoids that.
        # `+cpu` labels are explicit: a bare ==2.1.2 could resolve to a
        # PyPI CUDA wheel (~2 GB of nvidia-* deps).
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch==2.1.2+cpu torchvision==0.16.2+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation -r scripts/upscale/requirements.txt

      - name: Patch basicsr for torchvision compatibility
        # basicsr 1.4.2 imports torchvision.transforms.functional_tensor,
        # removed in torchvision >= 0.17. Our pins avoid it, this patch is
        # a defensive fix if the pins are ever relaxed. NOTE: basicsr's
        # location is resolved WITHOUT importing it — importing basicsr
        # would itself fail when the patch is needed.
        run: |
          SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          DEGRADATIONS="$SITE/basicsr/data/degradations.py"
          if [ -f "$DEGRADATIONS" ] && grep -q "functional_tensor" "$DEGRADATIONS"; then
            sed -i 's/from torchvision.transforms.functional_tensor import rgb_to_grayscale/from torchvision.transforms.functional import rgb_to_grayscale/' "$DEGRADATIONS"
            echo "basicsr patched (functional_tensor import rewritten)"
          else
            echo "basicsr already compatible — no patch needed"
          fi

      - name: Run batch worker (Etsy product images)
        env:
          ASSET_API_URL: ${{ secrets.ASSET_API_URL }}
          ASSET_API_KEY: ${{ secrets.ASSET_API_KEY }}
          MAX_NUMBER_OF_UPSCALES_PER_IMAGE: ${{ inputs.max_upscales_per_image || secrets.MAX_NUMBER_OF_UPSCALES_PER_IMAGE || '1' }}
          DEFAULT_SCALE: ${{ inputs.scale || secrets.DEFAULT_SCALE || '4' }}
          UPSCALE_MODEL: ${{ inputs.model || 'RealESRGAN_x4plus' }}
          UPSCALE_OUTPUT_FORMAT: ${{ inputs.output_format || 'jpg' }}
          UPSCALE_JPEG_QUALITY: ${{ inputs.jpeg_quality || '95' }}
          UPSCALE_TILE_WORKERS: ${{ inputs.tile_workers || 'auto' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/upscale/batch.py --source etsy --max-images "${{ inputs.max_images || '5' }}" $DRY_RUN_FLAG
