services:
  - type: web
    name: adobe-stock-images-generator-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: "1"
